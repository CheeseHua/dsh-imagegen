name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The probes import @deepseek-ai/schemastery, @deepseek-ai/dsh-tools,
      # @deepseek-ai/dsh-typert-protocol, @deepseek-ai/cordis and zod. A plain
      # install resolves them from the registry when published; dsh vendors
      # them, so failure to install is tolerated rather than failing the build.
      - name: Install peer packages
        continue-on-error: true
        run: npm install --no-save --no-package-lock @deepseek-ai/schemastery @deepseek-ai/dsh-tools @deepseek-ai/dsh-typert-protocol @deepseek-ai/cordis zod

      - name: Syntax check
        run: node --check lib/index.js && node --check lib/client.js

      - name: Unit probe
        run: node tools/probe.mjs

      - name: Client bundle probe
        run: node tools/client.mjs

      - name: Integration probe
        run: node tools/integration.mjs
